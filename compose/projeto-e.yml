# compose/projeto-e.yml — serviços do projeto-e (backend, frontend, db)
#
# Gerenciado pelo deployer.js. Não subir manualmente em produção.
# Para subir o projeto-e junto com o Nginx:
#   docker compose -f docker-compose.yml -f compose/projeto-e.yml up -d \
#     projeto-e-backend projeto-e-frontend projeto-e-db

services:
  projeto-e-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - envs/projeto-e.env
    volumes:
      - projeto-e-db-data:/var/lib/postgresql/data
    networks:
      - orq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  projeto-e-backend:
    image: projeto-e-backend:current
    restart: unless-stopped
    env_file:
      - envs/projeto-e.env
    environment:
      BASE_PATH: /projeto-e
    depends_on:
      projeto-e-db:
        condition: service_healthy
    networks:
      - orq-net

  projeto-e-frontend:
    image: projeto-e-frontend:current
    restart: unless-stopped
    env_file:
      - envs/projeto-e.env
    networks:
      - orq-net

volumes:
  projeto-e-db-data:

networks:
  orq-net:
    external: true
