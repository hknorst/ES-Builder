    # ----------------------------------------------------------------
    # portal-fake — fallback em /portal-fake/
    # ----------------------------------------------------------------

    location /portal-fake/api/ {
        set $upstream_fake_api "portal-fake-backend:3000";
        rewrite ^/portal-fake/api/(.*) /api/$1 break;
        proxy_pass http://$upstream_fake_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /portal-fake/api;
    }

    location /portal-fake/ {
        set $upstream_fake_fe "portal-fake-frontend";
        rewrite ^/portal-fake/(.*) /$1 break;
