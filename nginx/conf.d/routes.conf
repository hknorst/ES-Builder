# routes.conf — configuração de rotas do Nginx para o es-builder
#
# Estrutura de rotas por projeto:
#   /projeto-x/api/  → backend (API REST)
#   /projeto-x/      → frontend (React/Vite)
#
# Strip de prefixo: quando proxy_pass tem URI com trailing slash, o Nginx
# remove automaticamente o prefixo do location antes de repassar. Não usar
# rewrite junto com proxy_pass com URI — comportamento não-determinístico.
#
# IMPORTANTE: Se a porta de um projeto mudar em config/projeto-x.json,
# atualizar o proxy_pass do bloco /projeto-x/api/ e reiniciar o Nginx:
#   docker compose restart nginx
#
# Melhoria futura: setup.sh pode gerar este arquivo dinamicamente
# lendo os arquivos config/*.json em vez de mantê-lo manualmente.

server {
    listen 80;

    # DNS interno do Docker — necessário para re-resolver containers recriados dinamicamente
    resolver 127.0.0.11 valid=10s;

    # Redireciona raiz para o portal
    location = / {
        return 301 /portal/;
    }

    # ----------------------------------------------------------------
    # portal
    # ----------------------------------------------------------------

    # API do portal — bloco /api/ DEVE vir antes do bloco frontend
    # porta: ver config/portal.json → backend.port
    location /portal/api/ {
        proxy_pass http://portal-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /portal/api;
    }

    # Frontend do portal
    location /portal/ {
        proxy_pass http://portal-frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /portal;
    }

    # ----------------------------------------------------------------
    # projeto-a
    # ----------------------------------------------------------------

    # API do projeto-a — bloco /api/ DEVE vir antes do bloco frontend
    # porta: ver config/projeto-a.json → backend.port
    location /projeto-a/api/ {
        proxy_pass http://projeto-a-backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-a/api;
    }

    # Frontend do projeto-a
    location /projeto-a/ {
        proxy_pass http://projeto-a-frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-a;
    }

    # ----------------------------------------------------------------
    # projeto-b
    # ----------------------------------------------------------------

