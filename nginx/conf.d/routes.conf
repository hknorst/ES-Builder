        proxy_set_header X-Forwarded-Prefix /projeto-d/api;
    }

    location /projeto-d/ {
        set $upstream_d_fe "projeto-d-frontend";
        proxy_pass http://$upstream_d_fe/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-d;
    }

    # ----------------------------------------------------------------
    # projeto-e
    # ----------------------------------------------------------------

    location /projeto-e/api/ {
        set $upstream_e_api "projeto-e-backend:3000";
