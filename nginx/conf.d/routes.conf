    # ----------------------------------------------------------------

    location /projeto-d/api/ {
        set $upstream_d_api "projeto-d-backend:3000";
        rewrite ^/projeto-d/api/(.*) /api/$1 break;
        proxy_pass http://$upstream_d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-d/api;
    }

    location /projeto-d/ {
        set $upstream_d_fe "projeto-d-frontend";
        rewrite ^/projeto-d/(.*) /$1 break;
