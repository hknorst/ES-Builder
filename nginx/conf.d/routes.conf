        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /portal-fake;
    }

    # ----------------------------------------------------------------
    # projeto-e
    # ----------------------------------------------------------------


    location /projeto-e/api/ {
        set $upstream_e_api "projeto-e-backend:3000";
        rewrite ^/projeto-e/api/(.*) /api/$1 break;
        proxy_pass http://$upstream_e_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-e/api;
    }

    location /projeto-e/ {
        set $upstream_e_fe "projeto-e-frontend";
