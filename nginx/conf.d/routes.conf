        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-c/api;
    }

    location /projeto-c/ {
        set $upstream_c_fe "projeto-c-frontend";
        proxy_pass http://$upstream_c_fe/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
