# routes.conf — configuração de rotas do Nginx para o es-builder
#
# Estrutura de rotas por projeto:
#   /projeto-x/api/  → backend (API REST)
#   /projeto-x/      → frontend (React/Vite)
#
# Strip de prefixo: quando proxy_pass tem URI com trailing slash, o Nginx
# remove automaticamente o prefixo do location antes de repassar. Não usar
# rewrite junto com proxy_pass com URI — comportamento não-determinístico.
#
# IMPORTANTE: proxy_pass usa variável ($upstream_*) para forçar resolução
# DNS em tempo de requisição via resolver 127.0.0.11. Sem isso, o Nginx
# falha na inicialização se algum container ainda não estiver no ar.
#
# Se a porta de um projeto mudar em config/projeto-x.json,
# atualizar o proxy_pass do bloco /projeto-x/api/ e reiniciar o Nginx:
#   docker compose restart nginx

server {
    listen 80;

    # DNS interno do Docker — necessário para re-resolver containers recriados dinamicamente
    resolver 127.0.0.11 valid=10s;

    # Redireciona raiz para o portal
    location = / {
        return 301 /portal/;
    }

    # ----------------------------------------------------------------
    # portal
    # ----------------------------------------------------------------

    location /portal/api/ {
        set $upstream_portal_api "portal-backend:3000";
        proxy_pass http://$upstream_portal_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /portal/api;
    }

    location /portal/ {
        set $upstream_portal_fe "portal-frontend";
        proxy_pass http://$upstream_portal_fe/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /portal;
    }

    # ----------------------------------------------------------------
    # projeto-a
    # ----------------------------------------------------------------

    location /projeto-a/api/ {
        set $upstream_a_api "projeto-a-backend:3000";
        proxy_pass http://$upstream_a_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-a/api;
    }

    location /projeto-a/ {
        set $upstream_a_fe "projeto-a-frontend";
        proxy_pass http://$upstream_a_fe/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Prefix /projeto-a;
    }

    # ----------------------------------------------------------------
    # projeto-b
    # ----------------------------------------------------------------

    location /projeto-b/api/ {
